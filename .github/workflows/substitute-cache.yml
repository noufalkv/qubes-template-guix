# SPDX-License-Identifier: GPL-3.0-or-later
#
# Publish a static Guix substitute cache for the Qubes channel to GitHub Pages.
#
# SECURITY HOLD (2026-07-22): automatic execution is disabled and the only
# remaining manual entry point fails before checkout, key access, or Guix
# execution.  The previous Guix 1.5.0 bootstrap daemon predates the fixes in
# https://guix.gnu.org/en/blog/2026/guix-substitute-pull-vulnerabilities/.
# Re-enabling this workflow requires a source-only upgrade to a verified fixed
# daemon before any substitute is consumed, plus rotation of the development
# cache signing key and a clean rebuild of every published object.
#
# The Qubes channel has no substitute server, so a template's
# "guix pull && guix system reconfigure" otherwise rebuilds every Qubes
# derivation locally whenever the upstream Guix toolchain moves.  Guix itself
# stays UNPINNED for security; this job just publishes prebuilt, signed nars for
# the channel-specific store paths so the in-template update downloads them.
#
# Trust model: nars are signed by an Ed25519 key whose PRIVATE half lives in the
# GUIX_SIGNING_KEY_SEC repository secret and whose PUBLIC half is committed at
# config/substitute-cache/signing-key.pub and authorized by the template.  GitHub
# Pages is an untrusted transport; the daemon verifies every narinfo signature.
#
# Guix is bootstrapped ONLY from the official GNU release binary on ftp.gnu.org,
# with its detached OpenPGP signature verified -- no third-party images or
# actions.  After bootstrap we "guix pull" the unpinned channels to current head.

name: substitute-cache

on:
  workflow_dispatch:

concurrency:
  group: substitute-cache
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GUIX_VERSION: '1.5.0'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Refuse publication while the Guix security hold is active
        run: |
          echo "::error::Substitute-cache publication is disabled until the bootstrap daemon is upgraded safely and the signing key is rotated."
          exit 1

      - name: Check out channel
        uses: actions/checkout@v4

      - name: Bootstrap Guix from the official GNU release (signature-verified)
        run: |
          set -euo pipefail
          base="https://ftp.gnu.org/gnu/guix"
          tarball="guix-binary-${GUIX_VERSION}.x86_64-linux.tar.xz"
          wget -nv "$base/$tarball" "$base/$tarball.sig"
          # Verify against the Guix maintainer key that signed this release
          # (Efraim Flashner); fingerprint confirmed from the .sig issuer.
          key=A28BF40C3E551372662D14F741AAE7DCCA3D8351
          gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys "$key" \
            || gpg --keyserver hkps://keys.openpgp.org --recv-keys "$key"
          gpg --verify "$tarball.sig" "$tarball"
          # Install exactly as etc/guix-install.sh does, non-interactively.
          sudo tar --warning=no-timestamp -xf "$tarball" -C /
          sudo mkdir -p /etc/guix
          if ! getent group guixbuild >/dev/null; then
            sudo groupadd --system guixbuild
          fi
          for i in $(seq -w 1 10); do
            if ! id -u "guixbuilder${i}" >/dev/null 2>&1; then
              sudo useradd -g guixbuild -G guixbuild -d /var/empty \
                -s "$(command -v nologin)" -c "Guix build user $i" \
                --system "guixbuilder${i}"
            fi
          done
          guix_root=/var/guix/profiles/per-user/root/current-guix
          echo "$guix_root/bin" >> "$GITHUB_PATH"

      - name: Start guix-daemon and authorize official substitutes
        run: |
          set -euo pipefail
          guix_root=/var/guix/profiles/per-user/root/current-guix
          # Launch the daemon directly (no systemd): the release unit file does
          # not fit the ephemeral runner, and a plain background daemon is the
          # reliable CI pattern.  Wait for its socket before proceeding.
          sudo "$guix_root/bin/guix-daemon" --build-users-group=guixbuild \
            --substitute-urls='https://ci.guix.gnu.org https://bordeaux.guix.gnu.org' \
            >/tmp/guix-daemon.log 2>&1 &
          for i in $(seq 1 30); do
            [ -S /var/guix/daemon-socket/socket ] && break
            sleep 1
          done
          [ -S /var/guix/daemon-socket/socket ] || {
            echo "::error::guix-daemon socket never appeared"; cat /tmp/guix-daemon.log; exit 1; }
          for F in "$guix_root"/share/guix/*.pub; do
            sudo "$guix_root/bin/guix" archive --authorize < "$F"
          done

      - name: Refresh Guix and the Qubes channel (tracks current head, unpinned)
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=4
          while ! guix pull --fallback -C config/channels.scm --allow-downgrades; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::guix pull failed after $attempt attempts"
              exit 1
            fi
            delay=$((attempt * 15))
            echo "::warning::guix pull attempt $attempt/$max_attempts failed; retrying in ${delay}s"
            sleep "$delay"
            attempt=$((attempt + 1))
          done

      - name: Evaluate both system variants with the refreshed Guix
        run: |
          set -euo pipefail
          export PATH="$HOME/.config/guix/current/bin:$PATH"
          qubes_channel_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          [[ "$qubes_channel_commit" =~ ^[0-9a-f]{40}$ ]]
          export QUBES_TEMPLATE_CHANNEL_COMMIT="$qubes_channel_commit"
          guix system build --dry-run -L modules config/qubes-os-normal.scm
          guix system build --dry-run -L modules config/qubes-os-minimal.scm

      - name: Restore signing key
        env:
          GUIX_SIGNING_KEY_SEC: ${{ secrets.GUIX_SIGNING_KEY_SEC }}
        run: |
          set -euo pipefail
          if [ -z "${GUIX_SIGNING_KEY_SEC:-}" ]; then
            echo "::error::GUIX_SIGNING_KEY_SEC secret is not set. Generate a key,"
            echo "::error::store the private half as this secret, and commit the"
            echo "::error::public half to config/substitute-cache/signing-key.pub."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$GUIX_SIGNING_KEY_SEC" > "$RUNNER_TEMP/keys/signing-key.sec"
          cp config/substitute-cache/signing-key.pub "$RUNNER_TEMP/keys/signing-key.pub"
          chmod 600 "$RUNNER_TEMP/keys/signing-key.sec"

      - name: Build static substitute cache
        run: |
          set -euo pipefail
          export PATH="$HOME/.config/guix/current/bin:$PATH"
          ./scripts/build-substitute-cache.sh \
            --output "$RUNNER_TEMP/site" \
            --public-key "$RUNNER_TEMP/keys/signing-key.pub" \
            --private-key "$RUNNER_TEMP/keys/signing-key.sec" \
            --variant both \
            --compression zstd:19

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
