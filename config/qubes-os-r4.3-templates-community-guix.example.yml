# SPDX-License-Identifier: GPL-3.0-or-later
# Example release-config fragment for an R4.3 community Guix template.
#
# This is intentionally not publication-ready release metadata. The current RFC
# keeps release ownership and signing metadata out of the review gate; final
# publication metadata must come from whoever owns the accepted release.

components:
  - builder-guix:
      packages: False
      fetch-versions-only: false
      branch: main
      url: https://github.com/<OWNER>/qubes-builder-guix

templates:
  - guix:
      dist: guix
      timeout: 21600
  - guix-minimal:
      dist: guix
      flavor: minimal
      timeout: 21600
